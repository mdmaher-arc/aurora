name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin an exact version rather than `channel: stable`. Specifying both
          # makes the action try to resolve "stable" as a literal version
          # string and it fails with:
          #   Unable to determine Flutter version for channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.pub-cache
          key: gradle-${{ hashFiles('**/*.gradle*', 'pubspec.lock') }}
          restore-keys: gradle-

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload mapping and symbols
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurora-apk-extra
          path: |
            build/app/outputs/flutter-apk/*.sha256
            build/app/outputs/bundle/release/outputs-metadata.json
          if-no-files-found: ignore